version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Biblioteca: só sobe o piso da dependência quando a nova versão não cabe na faixa declarada.
    versioning-strategy: "increase-if-necessary"
    groups:
      python:
        patterns: ["*"]
